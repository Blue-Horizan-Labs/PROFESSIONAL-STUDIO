<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Choose a Professional Studio plan for your photography business.">
    <meta name="theme-color" content="#f8f7fb">
    <title>Choose a Plan | Professional Studio</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/8g0LT3jZ/logo1-2.png">
    <style>
        :root {
            color-scheme: light;
            --ink: #17151d;
            --muted: #716e7b;
            --line: #e8e5ee;
            --accent: #6d3ad1;
            --accent-soft: #f5f0ff;
            --danger: #a52e38;
            --danger-bg: #fff1f1;
            --success: #226b46;
            --success-bg: #eef9f1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background: #f8f7fb;
            color: var(--ink);
            font-family: Poppins, "Segoe UI", system-ui, sans-serif;
            line-height: 1.55;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input {
            font: inherit;
        }

        .page {
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            min-height: 76px;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -.03em;
        }

        .brand-mark {
            display: grid;
            width: 32px;
            height: 32px;
            place-items: center;
            border-radius: 9px;
            background: var(--ink);
            color: #fff;
        }

        .back-link {
            color: var(--muted);
            font-size: 13px;
        }

        .back-link:hover {
            color: var(--ink);
        }

        main {
            padding: 62px 0 72px;
        }

        .intro {
            max-width: 650px;
            margin: 0 auto 34px;
            text-align: center;
        }

        .eyebrow {
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        h1 {
            margin: 10px 0;
            font-size: clamp(30px, 5vw, 46px);
            letter-spacing: -.055em;
            line-height: 1.15;
        }

        .intro p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        .plans {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            align-items: stretch;
        }

        .plan-option {
            position: relative;
            display: block;
            cursor: pointer;
        }

        .plan-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }

        .plan-card {
            display: flex;
            height: 100%;
            min-height: 320px;
            flex-direction: column;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 17px;
            background: #fff;
            box-shadow: 0 8px 26px rgb(34 25 52 / 4%);
            transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
        }

        .plan-option:hover .plan-card {
            transform: translateY(-2px);
            border-color: #c8b3f0;
        }

        .plan-option input:checked + .plan-card {
            border: 2px solid var(--accent);
            padding: 23px;
            background: #fdfbff;
            box-shadow: 0 12px 34px rgb(109 58 209 / 12%);
        }

        .plan-option input:focus-visible + .plan-card {
            outline: 3px solid rgb(109 58 209 / 32%);
            outline-offset: 3px;
        }

        .plan-topline {
            display: flex;
            min-height: 22px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .plan-name {
            font-size: 18px;
            font-weight: 700;
        }

        .popular {
            padding: 4px 8px;
            border-radius: 999px;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .plan-description {
            min-height: 44px;
            margin: 5px 0 16px;
            color: var(--muted);
            font-size: 12px;
        }

        .price {
            margin-bottom: 2px;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.06em;
            line-height: 1.2;
        }

        .billing {
            color: var(--muted);
            font-size: 11px;
        }

        .plan-divider {
            display: block;
            width: 100%;
            height: 0;
            margin: 18px 0 14px;
            border-top: 1px solid var(--line);
        }

        .includes {
            margin-bottom: 10px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .features {
            display: grid;
            gap: 9px;
            margin: 0;
            padding: 0;
            list-style: none;
            font-size: 11px;
        }

        .features span::before {
            margin-right: 8px;
            color: var(--accent);
            content: "✓";
            font-weight: 700;
        }

        .plan-foot {
            margin-top: auto;
            padding-top: 16px;
            color: var(--muted);
            font-size: 10px;
        }

        .checkout {
            max-width: 440px;
            margin: 28px auto 0;
            text-align: center;
        }

        .continue-button {
            width: 100%;
            min-height: 48px;
            padding: 12px 18px;
            border: 0;
            border-radius: 10px;
            background: var(--ink);
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background .18s ease, opacity .18s ease;
        }

        .continue-button:hover:not(:disabled) {
            background: var(--accent);
        }

        .continue-button:disabled {
            cursor: wait;
            opacity: .65;
        }

        .secure-note {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 10px;
        }

        .form-message {
            display: none;
            margin: 0 0 12px;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #fff;
            color: var(--muted);
            font-size: 12px;
            text-align: left;
        }

        .form-message.show {
            display: block;
        }

        .form-message.error {
            border-color: #efc8ca;
            background: var(--danger-bg);
            color: var(--danger);
        }

        .form-message.success {
            border-color: #b7dfc4;
            background: var(--success-bg);
            color: var(--success);
        }

        @media (max-width: 820px) {
            .plans {
                max-width: 560px;
                grid-template-columns: 1fr;
                margin: 0 auto;
            }

            .plan-card {
                min-height: auto;
            }

            .plan-description {
                min-height: 0;
            }
        }

        @media (max-width: 520px) {
            .page {
                width: min(100% - 28px, 1120px);
            }

            .topbar {
                min-height: 64px;
            }

            .brand {
                font-size: 13px;
            }

            .back-link {
                font-size: 11px;
            }

            main {
                padding: 44px 0 52px;
            }

            .intro {
                margin-bottom: 27px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Professional Studio home">
                <span class="brand-mark" aria-hidden="true">◇</span>
                <span>Professional Studio</span>
            </a>
            <a class="back-link" href="/index.html#pricing">Back to pricing</a>
        </header>

        <main>
            <section class="intro" aria-labelledby="pageTitle">
                <span class="eyebrow">Choose your plan</span>
                <h1 id="pageTitle">The right tools for your studio.</h1>
                <p>Select a monthly plan. You’ll continue to secure checkout to complete your subscription.</p>
            </section>

            <form id="planForm" novalidate>
                <div class="plans" id="planOptions" role="radiogroup" aria-label="Available paid plans"></div>
                <div class="checkout">
                    <div class="form-message" id="formMessage" role="alert" aria-live="polite"></div>
                    <button class="continue-button" id="continueButton" type="submit">
                        Continue to secure checkout
                    </button>
                    <p class="secure-note">Your payment is processed securely by Razorpay.</p>
                </div>
            </form>
        </main>
    </div>

    <script src="/plan-catalog.js"></script>
    <script src="/plan-selection.js"></script>
</body>

</html>
