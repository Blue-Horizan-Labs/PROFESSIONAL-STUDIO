<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Professional Studio</title>

<link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/8g0LT3jZ/logo1-2.png"
>

<style>

    /* =========================================================
       GLOBAL
    ========================================================= */

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        font-family:
            "Inter",
            "Segoe UI",
            Arial,
            sans-serif;

        background:#0b0b0b;
        color:#fff;

        min-height:100vh;

        display:flex;
        align-items:center;
        justify-content:center;

        padding:20px;
    }

    a{
        text-decoration:none;
        color:inherit;
    }

    button,
    input{
        font:inherit;
    }


    /* =========================================================
       CONTAINER
    ========================================================= */

    .container{
        width:100%;
        max-width:450px;
    }


    /* =========================================================
       CARD
    ========================================================= */

    .card{
        width:100%;

        background:#141414;

        border:1px solid #252525;

        border-radius:14px;

        padding:35px;
    }


    /* =========================================================
       ICON
    ========================================================= */

    .icon{
        width:52px;
        height:52px;

        display:flex;
        align-items:center;
        justify-content:center;

        background:#1d1d1d;

        border:1px solid #2a2a2a;

        border-radius:12px;

        font-size:21px;

        margin-bottom:22px;
    }


    /* =========================================================
       HEADING
    ========================================================= */

    h1{
        font-size:28px;
        font-weight:600;

        letter-spacing:-0.4px;

        margin-bottom:8px;
    }

    .description{
        color:#9d9d9d;

        font-size:14px;

        line-height:1.5;

        margin-bottom:30px;
    }


    /* =========================================================
       FORM
    ========================================================= */

    .form-group{
        margin-bottom:20px;
    }

    label{
        display:block;

        font-size:14px;

        font-weight:500;

        color:#d5d5d5;

        margin-bottom:8px;
    }

    .input{
        width:100%;

        height:auto;

        padding:14px;

        background:#1d1d1d;

        border:1px solid #303030;

        border-radius:10px;

        color:#fff;

        outline:none;

        font-size:15px;

        transition:
            border-color .2s ease,
            box-shadow .2s ease,
            background .2s ease;
    }

    .input::placeholder{
        color:#707070;
    }

    .input:focus{
        border-color:#3b82f6;

        box-shadow:
            0 0 0 3px
            rgba(59,130,246,.08);
    }

    .input.error{
        border-color:#dc2626;
    }


    /* =========================================================
       ERROR
    ========================================================= */

    .error-message{
        display:none;

        margin-top:7px;

        font-size:12px;

        color:#ff8a8a;
    }

    .error-message.show{
        display:block;
    }


    /* =========================================================
       BUTTON
    ========================================================= */

    .submit-btn{
        width:100%;

        padding:14px;

        border:none;

        border-radius:10px;

        background:#2563eb;

        color:#fff;

        font-size:15px;

        font-weight:600;

        cursor:pointer;

        transition:
            background .2s ease,
            transform .2s ease,
            opacity .2s ease;
    }

    .submit-btn:hover{
        background:#1d4ed8;

        transform:translateY(-1px);
    }

    .submit-btn:disabled{
        opacity:.55;

        cursor:not-allowed;

        transform:none;
    }


    /* =========================================================
       SUCCESS
    ========================================================= */

    .success{
        display:none;

        margin-top:18px;

        padding:12px 14px;

        border-radius:9px;

        background:#13361d;

        border:1px solid #1d542b;

        color:#7ee787;

        font-size:12px;

        line-height:1.5;
    }

    .success.show{
        display:block;
    }


    /* =========================================================
       BACK LOGIN
    ========================================================= */

    .back-login{
        display:flex;

        justify-content:center;

        margin-top:21px;
    }

    .back-login a{
        font-size:13px;

        color:#8b8b8b;

        transition:color .2s ease;
    }

    .back-login a:hover{
        color:#fff;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width:500px){

        body{
            padding:15px;
        }

        .card{
            padding:25px;
        }

        h1{
            font-size:24px;
        }

        .description{
            font-size:13px;
            margin-bottom:25px;
        }

        .icon{
            width:48px;
            height:48px;

            font-size:19px;

            margin-bottom:19px;
        }
    }

</style>


</head>

<body>


<div class="container">

    <div class="card">

        <div class="icon">
            🔐
        </div>


        <h1>
            Forgot Password?
        </h1>


        <p class="description">
            Enter the email address associated with your
            Professional Studio account and we'll send you
            a link to reset your password.
        </p>


        <form id="forgotForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    class="input"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <div
                    class="error-message"
                    id="errorMessage"
                >
                    Please enter a valid email address.
                </div>

            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Send Reset Link
            </button>

        </form>


        <div
            class="success"
            id="successMessage"
        >
            ✓ Reset link sent. Please check your email
            and follow the instructions.
        </div>


        <div class="back-login">

            <a href="/auth/login-new.html">
                ← Back to Login
            </a>

        </div>

    </div>

</div>


<script>

    const form =
        document.getElementById("forgotForm");

    const email =
        document.getElementById("email");

    const errorMessage =
        document.getElementById("errorMessage");

    const submitBtn =
        document.getElementById("submitBtn");

    const successMessage =
        document.getElementById("successMessage");


    function validEmail(value){

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(value);

    }


    form.addEventListener(
        "submit",
        async function(event){

            event.preventDefault();


            const emailValue =
                email.value.trim();


            /* =================================================
               VALIDATION
            ================================================= */

            if(
                !emailValue ||
                !validEmail(emailValue)
            ){

                email.classList.add("error");

                errorMessage.classList.add("show");

                return;

            }


            email.classList.remove("error");

            errorMessage.classList.remove("show");


            /* =================================================
               LOADING
            ================================================= */

            submitBtn.disabled = true;

            submitBtn.textContent =
                "Sending...";


            try{

                /*
                 * =================================================
                 * CONNECT YOUR BACKEND HERE
                 * =================================================
                 *
                 * Example:
                 *
                 * const response = await fetch(
                 *     "/api/auth/forgot-password",
                 *     {
                 *         method: "POST",
                 *         headers: {
                 *             "Content-Type":
                 *                 "application/json"
                 *         },
                 *         body: JSON.stringify({
                 *             email: emailValue
                 *         })
                 *     }
                 * );
                 *
                 * if (!response.ok) {
                 *     throw new Error(
                 *         "Unable to send reset link"
                 *     );
                 * }
                 */


                /* Temporary demo delay */

                await new Promise(
                    resolve =>
                        setTimeout(
                            resolve,
                            1000
                        )
                );


                successMessage.classList.add(
                    "show"
                );

                submitBtn.textContent =
                    "Reset Link Sent ✓";


            }catch(error){

                submitBtn.textContent =
                    "Try Again";

                alert(
                    "Something went wrong. Please try again."
                );

            }finally{

                setTimeout(
                    () => {

                        submitBtn.disabled =
                            false;

                    },
                    1500
                );

            }

        }
    );


    /* =========================================================
       REMOVE ERROR WHILE TYPING
    ========================================================= */

    email.addEventListener(
        "input",
        function(){

            email.classList.remove(
                "error"
            );

            errorMessage.classList.remove(
                "show"
            );

        }
    );

</script>


</body>

</html>
