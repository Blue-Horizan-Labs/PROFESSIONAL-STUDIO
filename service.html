<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="Choose a photography service to book.">
    <title>Choose a Service | Professional Studio</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/8g0LT3jZ/logo1-2.png">
    <link rel="stylesheet" href="service.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand">Professional Studio</a>
            <nav class="nav-links" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="#services" class="active" aria-current="page">Services</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="service-section" id="services">
            <div class="service-container">
                <div class="section-heading">
                    <p class="section-label">PHOTOGRAPHY SERVICES</p>
                    <h1>Choose a Service</h1>
                    <p>Select a service to continue to booking.</p>
                </div>

                <p id="servicesStatus" role="status" aria-live="polite">
                    Loading services…
                </p>
                <div id="servicesContainer" class="packages-grid"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>© 2026 Professional Studio. All rights reserved.</p>
            <a href="index.html">Back to Home</a>
        </div>
    </footer>

    <script src="service.js"></script>
</body>
</html>
