<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/8g0LT3jZ/logo1-2.png" 
>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
    overflow:hidden;

    background:#ffffff;
    color:#111111;
}

/* ================= BACKGROUND GLOW ================= */

body::before{
    content:"";
    position:absolute;

    width:40vw;
    height:40vw;

    min-width:220px;
    min-height:220px;

    max-width:520px;
    max-height:520px;

    border-radius:50%;
    background:#7c3aed;

    filter:blur(140px);
    opacity:.07;

    top:-10%;
    left:-10%;
}

body::after{
    content:"";
    position:absolute;

    width:35vw;
    height:35vw;

    min-width:200px;
    min-height:200px;

    max-width:450px;
    max-height:450px;

    border-radius:50%;
    background:#a78bfa;

    filter:blur(140px);
    opacity:.06;

    right:-8%;
    bottom:-8%;
}

/* ================= LOGIN CONTAINER ================= */

.login-container{
    position:relative;
    width:100%;
    max-width:430px;
    margin:20px;
    padding:45px;
    overflow:hidden;

    border-radius:22px;

    background:#ffffff;

    border:1px solid #e5e5e5;

    box-shadow:
        0 20px 50px rgba(0,0,0,.08);

    z-index:10;
}

.login-container::before{
    content:"";
    position:absolute;
    inset:0;

    border-radius:22px;

    border:1px solid rgba(124,58,237,.12);

    pointer-events:none;
}

/* ================= HEADINGS ================= */

h1{
    color:#111111;
    text-align:center;
    margin-bottom:10px;
    font-size:2rem;
    font-weight:700;
}

h1+p{
    text-align:center;
    color:#666666;
    margin-bottom:35px;
    font-size:.95rem;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;

    color:#333333;

    font-size:.92rem;
    font-weight:600;
}

input{
    width:100%;
    padding:15px 18px;

    border-radius:12px;

    border:1px solid #dddddd;

    background:#f7f7f7;

    color:#111111;
    font-size:15px;

    transition:.35s;
}

input::placeholder{
    color:#999999;
}

input:focus{
    outline:none;

    border-color:#7c3aed;

    background:#ffffff;

    box-shadow:
        0 0 0 4px rgba(124,58,237,.10);
}

/* ================= OPTIONS ================= */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:28px;

    font-size:.9rem;
}

.options label{
    display:flex;
    align-items:center;
    gap:8px;

    margin:0;

    color:#666666;
    font-weight:400;
}

.options input[type="checkbox"]{
    width:16px;
    height:16px;

    margin:0;

    cursor:pointer;

    accent-color:#7c3aed;
}

.options a{
    color:#7c3aed;
    text-decoration:none;
    transition:.3s;
}

.options a:hover{
    color:#6d28d9;
}

/* ================= BUTTON ================= */

button{
    width:100%;
    padding:16px;

    border:none;
    border-radius:50px;

    background:#111111;

    color:#ffffff;

    font-size:16px;
    font-weight:600;

    cursor:pointer;

    transition:.35s;

    box-shadow:
        0 12px 30px rgba(0,0,0,.12);
}

button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 18px 40px rgba(0,0,0,.16);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

/* ================= SIGNUP ================= */

.signup{
    margin-top:28px;
    text-align:center;
    color:#666666;
    font-size:.95rem;
}

.signup a{
    color:#7c3aed;
    font-weight:600;
    text-decoration:none;
    transition:.3s;
}

.signup a:hover{
    color:#6d28d9;
}

/* ---------- Tablet ---------- */

@media (max-width:992px){

    .login-container{
        max-width:420px;
        padding:40px 35px;
    }

    body::before{
        width:340px;
        height:340px;
        top:-120px;
        left:-120px;
        filter:blur(120px);
    }

    body::after{
        width:300px;
        height:300px;
        right:-100px;
        bottom:-100px;
        filter:blur(120px);
    }

}

/* ---------- Mobile ---------- */

@media (max-width:768px){

    body{
        padding:18px;
    }

    .login-container{
        width:100%;
        max-width:400px;
        margin:0;
        padding:35px 28px;
        border-radius:20px;
    }

    body::before{
        width:260px;
        height:260px;
        top:-90px;
        left:-100px;
        filter:blur(100px);
        opacity:.08;
    }

    body::after{
        width:220px;
        height:220px;
        right:-80px;
        bottom:-80px;
        filter:blur(95px);
        opacity:.07;
    }

    h1{
        font-size:1.8rem;
    }

    h1+p{
        font-size:.9rem;
        margin-bottom:28px;
    }

    input{
        padding:14px 16px;
        font-size:14px;
    }

    button{
        padding:15px;
        font-size:15px;
    }

}

/* ---------- Small Phones ---------- */

@media (max-width:480px){

    body{
        padding:16px;
    }

    .login-container{
        padding:30px 22px;
        border-radius:18px;
    }

    body::before{
        width:220px;
        height:220px;
        top:-80px;
        left:-90px;
        filter:blur(90px);
    }

    body::after{
        width:180px;
        height:180px;
        right:-70px;
        bottom:-70px;
        filter:blur(85px);
    }

    h1{
        font-size:1.6rem;
    }

    h1+p{
        font-size:.85rem;
        margin-bottom:24px;
    }

    .form-group{
        margin-bottom:18px;
    }

    input{
        padding:13px 15px;
        border-radius:12px;
    }

    button{
        padding:14px;
        border-radius:50px;
    }

    .options{
        font-size:.82rem;
        gap:10px;
        flex-wrap:wrap;
    }

    .signup{
        font-size:.9rem;
    }

}

/* ---------- Large Screens ---------- */

@media (min-width:1400px){

    body::before{
        width:520px;
        height:520px;
    }

    body::after{
        width:450px;
        height:450px;
    }

}
    </style>

</head>

<body>

    <div class="login-container">

        <h1>Login</h1>

        <p>Welcome back! Sign in to your account.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="/forget.html">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn">
                Sign In
            </button>

            <div class="signup">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </div>

        </form>

    </div>

    <script>

        const form = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");

        form.addEventListener("submit", function(event){

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if(!email || !password){
                alert("Please fill in both fields.");
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "Signing In...";

            fetch('/api/login',{

                method:'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body:JSON.stringify({
                    email,
                    password
                })

            })

            .then(response=>response.json())

            .then(data=>{

                loginBtn.disabled = false;
                loginBtn.textContent = "Sign In";

                if(data.message === "Login successful"){

                    //alert("Login successful!");

                    window.location.href = "/user.html";

                }else{

                    alert(data.message || "Invalid email or password.");

                }

            })

            .catch(error=>{

                console.error(error);

                loginBtn.disabled = false;
                loginBtn.textContent = "Sign In";

                alert("Unable to connect to the server. Please try again.");

            });

        });

    </script>

</body>
</html>
