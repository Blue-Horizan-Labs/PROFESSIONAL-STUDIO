<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Studio | Login</title>

<link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/8g0LT3jZ/logo1-2.png"
>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Segoe UI",sans-serif;
    }

    body{
        background:#0b0b0b;
        color:#fff;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    /* ================= LOGIN CONTAINER ================= */

    .login-container{
        width:100%;
        max-width:450px;
    }

    /* ================= CARD ================= */

    .login-card{
        background:#141414;
        border:1px solid #252525;
        border-radius:14px;
        padding:35px;
    }

    /* ================= HEADING ================= */

    h1{
        font-size:28px;
        font-weight:600;
        margin-bottom:8px;
    }

    .subtitle{
        color:#9d9d9d;
        font-size:14px;
        margin-bottom:30px;
        line-height:1.5;
    }

    /* ================= FORM ================= */

    .form-group{
        margin-bottom:22px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-size:14px;
        color:#d5d5d5;
    }

    /* ================= INPUTS ================= */

    input[type="email"],
    input[type="password"],
    input[type="text"]{
        width:100%;
        background:#1d1d1d;
        border:1px solid #303030;
        color:#fff;
        padding:14px;
        border-radius:10px;
        outline:none;
        font-size:15px;
        transition:border-color .25s, box-shadow .25s;
    }

    input::placeholder{
        color:#777;
    }

    input:focus{
        border-color:#3b82f6;
        box-shadow:0 0 0 3px rgba(59,130,246,.08);
    }

    /* ================= PASSWORD ================= */

    .password-wrapper{
        position:relative;
    }

    .password-wrapper input{
        padding-right:55px;
    }

    .password-toggle{
        position:absolute;
        right:12px;
        top:50%;
        transform:translateY(-50%);
        width:32px;
        height:32px;
        padding:0;
        margin:0;
        border:none;
        border-radius:50%;
        background:transparent;
        color:#888;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        box-shadow:none;
        transition:color .25s, background .25s;
    }

    .password-toggle:hover{
        transform:translateY(-50%);
        color:#fff;
        background:#252525;
        box-shadow:none;
    }

    .password-toggle:active{
        transform:translateY(-50%);
    }

    .password-toggle:focus{
        outline:none;
        box-shadow:0 0 0 3px rgba(59,130,246,.08);
    }

    .password-toggle svg{
        width:18px;
        height:18px;
        stroke:currentColor;
        stroke-width:2;
        fill:none;
        stroke-linecap:round;
        stroke-linejoin:round;
        pointer-events:none;
    }

    /* ================= OPTIONS ================= */

    .options{
        display:flex;
        justify-content:space-between;
        align-items:center;
        margin-top:-2px;
        margin-bottom:25px;
        font-size:14px;
    }

    .remember{
        display:flex;
        align-items:center;
        gap:8px;
        color:#9d9d9d;
        cursor:pointer;
        user-select:none;
    }

    .remember input{
        width:15px;
        height:15px;
        margin:0;
        cursor:pointer;
        accent-color:#2563eb;
    }

    .options a{
        color:#8b8b8b;
        text-decoration:none;
        transition:.3s;
    }

    .options a:hover{
        color:#fff;
    }

    /* ================= LOGIN BUTTON ================= */

    #loginBtn{
        width:100%;
        padding:14px;
        border:none;
        border-radius:10px;
        background:#2563eb;
        color:white;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
        transition:.3s;
    }

    #loginBtn:hover{
        background:#1d4ed8;
    }

    #loginBtn:active{
        transform:translateY(1px);
    }

    #loginBtn:disabled{
        opacity:.55;
        cursor:not-allowed;
        transform:none;
    }

    /* ================= SIGNUP ================= */

    .signup{
        text-align:center;
        margin-top:25px;
        color:#9d9d9d;
        font-size:14px;
    }

    .signup a{
        color:#8b8b8b;
        font-weight:600;
        text-decoration:none;
        transition:.3s;
    }

    .signup a:hover{
        color:#fff;
    }

    /* ================= MOBILE ================= */

    @media(max-width:500px){

        body{
            padding:20px;
        }

        .login-card{
            padding:25px;
        }

        h1{
            font-size:24px;
        }

        .subtitle{
            font-size:14px;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:20px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"]{
            padding:14px;
            font-size:14px;
        }

        .password-wrapper input{
            padding-right:52px;
        }

        .password-toggle{
            right:10px;
        }

        .options{
            font-size:13px;
            gap:12px;
        }

        .signup{
            font-size:13px;
        }

    }

</style>


</head>

<body>


<div class="login-container">

    <div class="login-card">

        <h1>Login</h1>

        <p class="subtitle">
            Welcome back! Sign in to your account.
        </p>

        <form id="loginForm">

            <!-- ================= EMAIL ================= -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- ================= PASSWORD ================= -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                        title="Show password"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>

            </div>


            <!-- ================= OPTIONS ================= -->

            <div class="options">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="rememberMe"
                    >

                    Remember me

                </label>


                <a href="/forget.html">
                    Forgot Password?
                </a>

            </div>


            <!-- ================= LOGIN BUTTON ================= -->

            <button
                type="submit"
                id="loginBtn"
            >
                Sign In
            </button>


            <!-- ================= SIGNUP ================= -->

            <div class="signup">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </div>

        </form>

    </div>

</div>


<script>

    const form =
        document.getElementById("loginForm");

    const loginBtn =
        document.getElementById("loginBtn");

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.getElementById("passwordToggle");


    /* =========================================================
       PASSWORD VISIBILITY TOGGLE
    ========================================================= */

    passwordToggle.addEventListener(
        "click",
        function(){

            const isPassword =
                passwordInput.type === "password";


            if(isPassword){

                passwordInput.type = "text";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Hide password"
                );

                passwordToggle.setAttribute(
                    "title",
                    "Hide password"
                );

                passwordToggle.innerHTML = `

                    <svg
                        class="eye-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path d="M3 3l18 18"></path>

                        <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>

                        <path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.2 17.2 0 0 1-3.1 3.9"></path>

                        <path d="M6.1 6.1C3.6 8 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1"></path>

                    </svg>

                `;

            }else{

                passwordInput.type = "password";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Show password"
                );

                passwordToggle.setAttribute(
                    "title",
                    "Show password"
                );

                passwordToggle.innerHTML = `

                    <svg
                        class="eye-icon"
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    </svg>

                `;

            }

        }
    );


    /* =========================================================
       LOGIN
    ========================================================= */

    form.addEventListener(
        "submit",
        function(event){

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            /* ================= VALIDATION ================= */

            if(!email || !password){

                alert(
                    "Please fill in both fields."
                );

                return;

            }


            /* ================= BUTTON STATE ================= */

            loginBtn.disabled = true;

            loginBtn.textContent =
                "Signing In...";


            /* ================= LOGIN REQUEST ================= */

            fetch(
                "/api/login",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({
                        email,
                        password
                    })

                }
            )

            .then(
                response =>
                    response.json()
            )

            .then(
                data => {

                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        "Sign In";


                    if(
                        data.message ===
                        "Login successful"
                    ){

                        window.location.href =
                            "/user.html";

                    }else{

                        alert(
                            data.message ||
                            "Invalid email or password."
                        );

                    }

                }
            )

            .catch(
                error => {

                    console.error(error);

                    loginBtn.disabled =
                        false;

                    loginBtn.textContent =
                        "Sign In";


                    alert(
                        "Unable to connect to the server. Please try again."
                    );

                }
            );

        }
    );

</script>


</body>

</html>
