<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Studio | Create Account</title>

<link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/8g0LT3jZ/logo1-2.png"
>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:"Segoe UI",sans-serif;
    }

    html,
    body{
        width:100%;
        min-height:100%;
    }

    body{
        background:#0b0b0b;
        color:#fff;
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
        overflow-x:hidden;
        overflow-y:auto;
    }

    /* ================= SIGNUP CONTAINER ================= */

    .signup-container{
        width:100%;
        max-width:450px;
    }

    /* ================= CARD ================= */

    .signup-card{
        background:#141414;
        border:1px solid #252525;
        border-radius:14px;
        padding:35px;
    }

    /* ================= HEADING ================= */

    h1{
        font-size:28px;
        font-weight:600;
        margin-bottom:8px;
    }

    .subtitle{
        color:#9d9d9d;
        font-size:14px;
        margin-bottom:30px;
        line-height:1.5;
    }

    /* ================= FORM ================= */

    .form-group{
        margin-bottom:22px;
    }

    label{
        display:block;
        margin-bottom:8px;
        font-size:14px;
        color:#d5d5d5;
    }

    /* ================= INPUTS ================= */

    input[type="email"],
    input[type="password"],
    input[type="text"]{
        width:100%;
        background:#1d1d1d;
        border:1px solid #303030;
        color:#fff;
        padding:14px;
        border-radius:10px;
        outline:none;
        font-size:15px;
        transition:border-color .25s, box-shadow .25s;
    }

    input::placeholder{
        color:#777;
    }

    input:focus{
        border-color:#3b82f6;
        box-shadow:0 0 0 3px rgba(59,130,246,.08);
    }

    /* ================= PASSWORD WRAPPER ================= */

    .password-wrapper{
        position:relative;
    }

    .password-wrapper input{
        padding-right:55px;
    }

    .password-toggle{
        position:absolute;
        right:12px;
        top:50%;
        transform:translateY(-50%);
        width:32px;
        height:32px;
        padding:0;
        margin:0;
        border:none;
        border-radius:50%;
        background:transparent;
        color:#888;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        box-shadow:none;
        transition:color .25s, background .25s;
    }

    .password-toggle:hover{
        transform:translateY(-50%);
        color:#fff;
        background:#252525;
        box-shadow:none;
    }

    .password-toggle:active{
        transform:translateY(-50%);
    }

    .password-toggle:focus{
        outline:none;
        box-shadow:0 0 0 3px rgba(59,130,246,.08);
    }

    .password-toggle svg{
        width:18px;
        height:18px;
        stroke:currentColor;
        stroke-width:2;
        fill:none;
        stroke-linecap:round;
        stroke-linejoin:round;
        pointer-events:none;
    }

    /* ================= REFERRAL ================= */

    .referral-group{
        margin-bottom:22px;
    }

    .referral-label{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
    }

    .optional-text{
        color:#777;
        font-size:12px;
        font-weight:400;
    }

    .referral-hint{
        margin-top:7px;
        color:#777;
        font-size:12px;
        line-height:1.4;
    }

    /* ================= SIGNUP BUTTON ================= */

    .signup-button{
        width:100%;
        padding:14px;
        margin-top:2px;
        border:none;
        border-radius:10px;
        background:#2563eb;
        color:white;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
        transition:.3s;
    }

    .signup-button:hover{
        background:#1d4ed8;
    }

    .signup-button:active{
        transform:translateY(1px);
    }

    .signup-button:disabled{
        opacity:.55;
        cursor:not-allowed;
        transform:none;
    }

    /* ================= LOGIN LINK ================= */

    .login-link{
        text-align:center;
        margin-top:25px;
        color:#9d9d9d;
        font-size:14px;
    }

    .login-link a{
        color:#8b8b8b;
        font-weight:600;
        text-decoration:none;
        transition:.3s;
    }

    .login-link a:hover{
        color:#fff;
    }

    /* ================= MOBILE ================= */

    @media(max-width:500px){

        body{
            padding:20px;
            align-items:flex-start;
            padding-top:30px;
            padding-bottom:30px;
        }

        .signup-card{
            padding:25px;
        }

        h1{
            font-size:24px;
        }

        .subtitle{
            font-size:14px;
            margin-bottom:25px;
        }

        .form-group{
            margin-bottom:20px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"]{
            padding:14px;
            font-size:14px;
        }

        .password-wrapper input{
            padding-right:52px;
        }

        .password-toggle{
            right:10px;
        }

        .signup-button{
            padding:14px;
            font-size:15px;
        }

        .login-link{
            font-size:13px;
        }

    }

    @media(max-width:360px){

        body{
            padding-left:15px;
            padding-right:15px;
        }

        .signup-card{
            padding:22px;
        }

        h1{
            font-size:23px;
        }

        .form-group{
            margin-bottom:18px;
        }

        .referral-group{
            margin-bottom:20px;
        }

    }

</style>


</head>

<body>


<div class="signup-container">

    <div class="signup-card">

        <h1>Create Account</h1>

        <p class="subtitle">
            Create your Professional Studio account.
        </p>


        <form id="signupForm">

            <!-- ================= EMAIL ================= -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- ================= PASSWORD ================= -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="password"
                        aria-label="Show password"
                        title="Show password"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>

            </div>


            <!-- ================= CONFIRM PASSWORD ================= -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="confirmPassword"
                        aria-label="Show password"
                        title="Show password"
                    >

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    </button>

                </div>

            </div>


            <!-- ================= REFERRAL CODE ================= -->

            <div class="form-group referral-group">

                <label
                    for="referralCode"
                    class="referral-label"
                >

                    <span>
                        Referral Code
                    </span>

                    <span class="optional-text">
                        Optional
                    </span>

                </label>

                <input
                    type="text"
                    id="referralCode"
                    placeholder="Enter referral code"
                    autocomplete="off"
                    maxlength="50"
                    spellcheck="false"
                >

                <div class="referral-hint">
                    Have a referral code? Enter it here.
                </div>

            </div>


            <!-- ================= SIGNUP BUTTON ================= -->

            <button
                type="submit"
                id="signupBtn"
                class="signup-button"
            >
                Create Account
            </button>


            <!-- ================= LOGIN LINK ================= -->

            <div class="login-link">

                Already have an account?

                <a href="/auth/login-new.html">
                    Sign In
                </a>

            </div>

        </form>

    </div>

</div>


<script>

    const form =
        document.getElementById("signupForm");

    const signupBtn =
        document.getElementById("signupBtn");


    /* =========================================================
       PASSWORD VISIBILITY TOGGLE
    ========================================================= */

    const passwordToggles =
        document.querySelectorAll(".password-toggle");


    passwordToggles.forEach(function(toggle){

        toggle.addEventListener(
            "click",
            function(){

                const targetId =
                    toggle.getAttribute("data-target");

                const passwordInput =
                    document.getElementById(targetId);


                if(!passwordInput){
                    return;
                }


                const isPassword =
                    passwordInput.type === "password";


                if(isPassword){

                    passwordInput.type = "text";

                    toggle.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                    toggle.setAttribute(
                        "title",
                        "Hide password"
                    );


                    toggle.innerHTML = `

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path d="M3 3l18 18"></path>

                            <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>

                            <path d="M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.2 17.2 0 0 1-3.1 3.9"></path>

                            <path d="M6.1 6.1C3.6 8 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1"></path>

                        </svg>

                    `;

                }else{

                    passwordInput.type = "password";

                    toggle.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                    toggle.setAttribute(
                        "title",
                        "Show password"
                    );


                    toggle.innerHTML = `

                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    `;

                }

            }
        );

    });


    /* =========================================================
       GET A USEFUL ERROR MESSAGE FROM ANY API RESPONSE
    ========================================================= */

    function getErrorMessage(data){

        if(!data){
            return "Unable to create account.";
        }


        /* Direct string response */

        if(typeof data === "string"){
            return data;
        }


        /* Normal API response */

        if(
            typeof data.message === "string" &&
            data.message.trim()
        ){
            return data.message;
        }


        /* Nested message */

        if(
            data.message &&
            typeof data.message === "object" &&
            typeof data.message.message === "string"
        ){
            return data.message.message;
        }


        /* Common error format */

        if(
            typeof data.error === "string" &&
            data.error.trim()
        ){
            return data.error;
        }


        /* Nested error */

        if(
            data.error &&
            typeof data.error === "object" &&
            typeof data.error.message === "string"
        ){
            return data.error.message;
        }


        /* Supabase-style nested error */

        if(
            data.error &&
            typeof data.error === "object" &&
            typeof data.error.error_description === "string"
        ){
            return data.error.error_description;
        }


        /* Details field */

        if(
            typeof data.details === "string" &&
            data.details.trim()
        ){
            return data.details;
        }


        /* Description field */

        if(
            typeof data.error_description === "string" &&
            data.error_description.trim()
        ){
            return data.error_description;
        }


        /* Last resort */

        try{

            return JSON.stringify(data);

        }catch(e){

            return "Unable to create account.";

        }

    }


    /* =========================================================
       RESET BUTTON
    ========================================================= */

    function resetSignupButton(){

        signupBtn.disabled = false;

        signupBtn.textContent =
            "Create Account";

    }


    /* =========================================================
       SIGNUP
    ========================================================= */

    form.addEventListener(
        "submit",
        async function(e){

            e.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;


            const referralCode =
                document
                    .getElementById("referralCode")
                    .value
                    .trim();


            /* ================= VALIDATION ================= */

            if(
                !email ||
                !password ||
                !confirmPassword
            ){

                alert(
                    "Please fill in all required fields."
                );

                return;

            }


            if(
                password !== confirmPassword
            ){

                alert(
                    "Passwords do not match."
                );

                return;

            }


            /* ================= BUTTON STATE ================= */

            signupBtn.disabled = true;

            signupBtn.textContent =
                "Creating Account...";


            try{

                const response =
                    await fetch(
                        "/api/signup",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:JSON.stringify({

                                email:email,

                                password:password,

                                referralCode:
                                    referralCode

                            })

                        }
                    );


                /* =================================================
                   READ RESPONSE SAFELY
                ================================================= */

                const contentType =
                    response.headers
                        .get("content-type") || "";


                let data;


                if(
                    contentType.includes(
                        "application/json"
                    )
                ){

                    data =
                        await response.json();

                }else{

                    const text =
                        await response.text();

                    data =
                        text || null;

                }


                console.log(
                    "Signup HTTP status:",
                    response.status
                );


                console.log(
                    "Signup response:",
                    data
                );


                /* =================================================
                   SUCCESS
                ================================================= */

                if(response.ok){

                    const message =
                        typeof data === "object" &&
                        data !== null
                            ? data.message
                            : data;


                    if(
                        message === "200" ||
                        data?.success === true ||
                        data?.status === "success" ||
                        data?.status === 200
                    ){

                        window.location.href =
                            "/setup.html";

                        return;

                    }


                    /* =================
                       OTHER SUCCESS RESPONSE
                    ================= */

                    if(
                        typeof data === "string" &&
                        (
                            data
                                .toLowerCase()
                                .includes("success") ||

                            data === "200"
                        )
                    ){

                        window.location.href =
                            "/setup.html";

                        return;

                    }

                }


                /* =================================================
                   ERROR
                ================================================= */

                const errorMessage =
                    getErrorMessage(data);


                alert(errorMessage);

                resetSignupButton();


            }catch(error){

                console.error(
                    "Signup request failed:",
                    error
                );


                resetSignupButton();


                alert(
                    error?.message ||
                    "Unable to connect to the server. Please try again."
                );

            }

        }
    );

</script>


</body>

</html>
