<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at top left,#6b7cff 0%,transparent 40%),
    radial-gradient(circle at bottom right,#8b5cf6 0%,transparent 40%),
    linear-gradient(135deg,#0f172a,#111827,#1e293b);
    overflow:hidden;
}

body::before{
    content:"";
    position:absolute;
    width:550px;
    height:550px;
    background:#7c3aed;
    filter:blur(180px);
    opacity:.25;
    top:-180px;
    left:-150px;
}

body::after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    background:#3b82f6;
    filter:blur(170px);
    opacity:.2;
    bottom:-150px;
    right:-120px;
}

.signup-container{
    position:relative;
    width:100%;
    max-width:430px;
    margin:20px;
    padding:45px;
    border-radius:22px;
    overflow:hidden;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.15);
}

.signup-container::before{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:22px;
    padding:1px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5,#3b82f6);
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    pointer-events:none;
}

h1{
    color:#fff;
    text-align:center;
    margin-bottom:10px;
    font-size:2rem;
    font-weight:700;
}

h1+p{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:35px;
    font-size:.95rem;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    color:#e2e8f0;
    margin-bottom:8px;
    font-size:.92rem;
    font-weight:600;
}

input{
    width:100%;
    padding:15px 18px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    color:#fff;
    font-size:15px;
    transition:.35s;
}

input::placeholder{
    color:#94a3b8;
}

input:focus{
    outline:none;
    border-color:#7c3aed;
    box-shadow:0 0 0 4px rgba(124,58,237,.15);
    background:rgba(255,255,255,.1);
}

button{
    width:100%;
    padding:16px;
    margin-top:10px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5,#2563eb);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.35s;
    box-shadow:0 12px 30px rgba(99,102,241,.35);
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 40px rgba(99,102,241,.45);
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

.login-link{
    margin-top:28px;
    text-align:center;
    color:#cbd5e1;
}

.login-link a{
    color:#8b5cf6;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    color:#a78bfa;
}

@media(max-width:500px){

.signup-container{
    padding:35px 28px;
}

h1{
    font-size:1.8rem;
}

}

    </style>

</head>

<body>

<div class="signup-container">

    <h1>Create Account</h1>

    <p>Create your Professional Studio account.</p>

    <form id="signupForm">

        <div class="form-group">
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required>
        </div>

       <a href="/setup.html"> <button type="submit" id="signupBtn">
            Create Account
        </button>
    </a>
        <div class="login-link">
            Already have an account?
            
            <a href="/auth/login-new.html"> Sign In </a>
            
                </div>

    </form>

</div>

<script>

const form = document.getElementById("signupForm");
const signupBtn = document.getElementById("signupBtn");

form.addEventListener("submit",function(e){

    e.preventDefault();

    const name=document.getElementById("name").value.trim();
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const confirmPassword=document.getElementById("confirmPassword").value;

    if(!name || !email || !password || !confirmPassword){
        alert("Please fill in all fields.");
        return;
    }

    if(password!==confirmPassword){
        alert("Passwords do not match.");
        return;
    }

    signupBtn.disabled=true;
    signupBtn.textContent="Creating Account...";

    fetch("/api/signup",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            name,
            email,
            password
        })

    })

    .then(response=>response.json())

    .then(data=>{

        signupBtn.disabled=false;
        signupBtn.textContent="Create Account";

        if(data.message==="200"){

            //alert("Account created successfully!");

            window.location.href="/setup.html";

        }else{

            alert(data.message || "Unable to create account.");

        }

    })

    .catch(error=>{

        console.error(error);

        signupBtn.disabled=false;
        signupBtn.textContent="Create Account";

        alert("Unable to connect to the server.");

    });

});

</script>

</body>
</html>
