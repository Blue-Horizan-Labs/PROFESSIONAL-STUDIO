<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins','Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ffffff;
    color:#111111;
    overflow:hidden;
    position:relative;
}

/* ================= BACKGROUND GLOW ================= */

body::before{
    content:"";
    position:absolute;

    width:550px;
    height:550px;

    background:#7c3aed;

    filter:blur(180px);
    opacity:.07;

    top:-180px;
    left:-150px;
}

body::after{
    content:"";
    position:absolute;

    width:450px;
    height:450px;

    background:#a78bfa;

    filter:blur(170px);
    opacity:.06;

    bottom:-150px;
    right:-120px;
}

/* ================= SIGNUP CONTAINER ================= */

.signup-container{
    position:relative;

    width:100%;
    max-width:430px;

    margin:20px;
    padding:45px;

    border-radius:22px;
    overflow:hidden;

    background:#ffffff;

    border:1px solid #e5e5e5;

    box-shadow:
        0 20px 50px rgba(0,0,0,.08);

    z-index:10;
}

.signup-container::before{
    content:"";
    position:absolute;

    inset:0;

    border-radius:22px;

    border:1px solid rgba(124,58,237,.12);

    pointer-events:none;
}

/* ================= HEADING ================= */

h1{
    color:#111111;
    text-align:center;

    margin-bottom:10px;

    font-size:2rem;
    font-weight:700;
}

h1+p{
    text-align:center;

    color:#666666;

    margin-bottom:35px;

    font-size:.95rem;
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:20px;
}

label{
    display:block;

    color:#333333;

    margin-bottom:8px;

    font-size:.92rem;
    font-weight:600;
}

input{
    width:100%;

    padding:15px 18px;

    border-radius:12px;

    border:1px solid #dddddd;

    background:#f7f7f7;

    color:#111111;

    font-size:15px;

    transition:.35s;
}

input::placeholder{
    color:#999999;
}

input:focus{
    outline:none;

    border-color:#7c3aed;

    box-shadow:
        0 0 0 4px rgba(124,58,237,.10);

    background:#ffffff;
}

/* ================= BUTTON ================= */

button{
    width:100%;

    padding:16px;

    margin-top:10px;

    border:none;

    border-radius:50px;

    background:#111111;

    color:#ffffff;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.35s;

    box-shadow:
        0 12px 30px rgba(0,0,0,.12);
}

button:hover{
    transform:translateY(-3px);

    box-shadow:
        0 18px 40px rgba(0,0,0,.16);
}

button:disabled{
    opacity:.7;
    cursor:not-allowed;
}

/* ================= LOGIN LINK ================= */

.login-link{
    margin-top:28px;

    text-align:center;

    color:#666666;
}

.login-link a{
    color:#7c3aed;

    text-decoration:none;

    font-weight:600;

    transition:.3s;
}

.login-link a:hover{
    color:#6d28d9;
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .signup-container{
        padding:35px 28px;
        border-radius:20px;
    }

    h1{
        font-size:1.8rem;
    }

    h1+p{
        font-size:.9rem;
        margin-bottom:28px;
    }

    input{
        padding:14px 16px;
        font-size:14px;
    }

    button{
        padding:15px;
        font-size:15px;
    }

}
    </style>

</head>

<body>

<div class="signup-container">

    <h1>Create Account</h1>

    <p>Create your Professional Studio account.</p>

    <form id="signupForm">


        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required>
        </div>

       <a href="/setup.html"> <button type="submit" id="signupBtn">
            Create Account
        </button>
    </a>
        <div class="login-link">
            Already have an account?
            
            <a href="/auth/login-new.html"> Sign In </a>
            
                </div>

    </form>

</div>

<script>

const form = document.getElementById("signupForm");
const signupBtn = document.getElementById("signupBtn");

form.addEventListener("submit",function(e){

    e.preventDefault();

    const name=document.getElementById("name").value.trim();
    const email=document.getElementById("email").value.trim();
    const password=document.getElementById("password").value;
    const confirmPassword=document.getElementById("confirmPassword").value;

    if(!name || !email || !password || !confirmPassword){
        alert("Please fill in all fields.");
        return;
    }

    if(password!==confirmPassword){
        alert("Passwords do not match.");
        return;
    }

    signupBtn.disabled=true;
    signupBtn.textContent="Creating Account...";

    fetch("/api/signup",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            name,
            email,
            password
        })

    })

    .then(response=>response.json())

    .then(data=>{

        signupBtn.disabled=false;
        signupBtn.textContent="Create Account";

        if(data.message==="200"){

            //alert("Account created successfully!");

            window.location.href="/setup.html";

        }else{

            alert(data.message || "Unable to create account.");

        }

    })

    .catch(error=>{

        console.error(error);

        signupBtn.disabled=false;
        signupBtn.textContent="Create Account";

        alert("Unable to connect to the server.");

    });

});

</script>

</body>
</html>
