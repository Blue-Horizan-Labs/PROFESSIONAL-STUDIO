<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #ffffff;
            color: #111111;

            overflow-x: hidden;
            overflow-y: auto;

            position: relative;
        }

        /* ================= BACKGROUND GLOW ================= */

        body::before {
            content: "";

            position: absolute;

            width: 550px;
            height: 550px;

            background: #7c3aed;

            filter: blur(180px);
            opacity: .07;

            top: -180px;
            left: -150px;

            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";

            position: absolute;

            width: 450px;
            height: 450px;

            background: #a78bfa;

            filter: blur(170px);
            opacity: .06;

            bottom: -150px;
            right: -120px;

            pointer-events: none;
            z-index: 0;
        }

        /* ================= SIGNUP CONTAINER ================= */

        .signup-container {
            position: relative;

            width: 100%;
            max-width: 430px;

            margin: 20px;
            padding: 45px;

            border-radius: 22px;

            background: #ffffff;

            border: 1px solid #e5e5e5;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, .08);

            z-index: 10;
        }

        .signup-container::before {
            content: "";

            position: absolute;

            inset: 0;

            border-radius: 22px;

            border: 1px solid rgba(124, 58, 237, .12);

            pointer-events: none;

            z-index: 0;
        }

        .signup-container > * {
            position: relative;
            z-index: 2;
        }

        /* ================= HEADING ================= */

        h1 {
            color: #111111;

            text-align: center;

            margin-bottom: 10px;

            font-size: 2rem;
            font-weight: 700;
        }

        h1 + p {
            text-align: center;

            color: #666666;

            margin-bottom: 35px;

            font-size: .95rem;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            color: #333333;

            margin-bottom: 8px;

            font-size: .92rem;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 15px 18px;

            border-radius: 12px;

            border: 1px solid #dddddd;

            background: #f7f7f7;

            color: #111111;

            font-size: 15px;

            transition: .35s;
        }

        input::placeholder {
            color: #999999;
        }

        input:focus {
            outline: none;

            border-color: #7c3aed;

            box-shadow:
                0 0 0 4px rgba(124, 58, 237, .10);

            background: #ffffff;
        }

        /* ================= BUTTON ================= */

        button {
            width: 100%;

            padding: 16px;

            margin-top: 10px;

            border: none;

            border-radius: 50px;

            background: #111111;

            color: #ffffff;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: .35s;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, .12);
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 18px 40px rgba(0, 0, 0, .16);
        }

        button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        /* ================= LOGIN LINK ================= */

        .login-link {
            position: relative;

            margin-top: 28px;

            text-align: center;

            color: #666666;

            z-index: 20;
        }

        .login-link a {
            position: relative;

            display: inline-block;

            color: #7c3aed;

            text-decoration: none;

            font-weight: 600;

            padding: 4px 2px;

            cursor: pointer;

            pointer-events: auto;

            z-index: 30;

            transition: .3s;
        }

        .login-link a:hover {
            color: #6d28d9;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 500px) {

            body {
                align-items: flex-start;

                padding: 20px 0;

                overflow-x: hidden;
                overflow-y: auto;
            }

            .signup-container {
                width: calc(100% - 30px);

                margin: 0 15px;

                padding: 35px 28px;

                border-radius: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            h1 + p {
                font-size: .9rem;

                margin-bottom: 28px;
            }

            input {
                padding: 14px 16px;

                font-size: 14px;
            }

            button {
                padding: 15px;

                font-size: 15px;
            }

            .login-link {
                margin-top: 24px;

                padding-bottom: 5px;
            }

            .login-link a {
                padding: 6px 4px;

                min-height: 32px;
            }
        }

        /* ================= VERY SMALL PHONES ================= */

        @media (max-width: 360px) {

            .signup-container {
                width: calc(100% - 20px);

                margin: 0 10px;

                padding: 30px 20px;
            }

            h1 {
                font-size: 1.65rem;
            }

            h1 + p {
                margin-bottom: 24px;
            }

            .form-group {
                margin-bottom: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <h1>Create Account</h1>

        <p>Create your Professional Studio account.</p>

        <form id="signupForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    required>
            </div>

            <button
                type="submit"
                id="signupBtn">
                Create Account
            </button>

            <div class="login-link">
                Already have an account?
                <a href="/auth/login-new.html">
                    Sign In
                </a>
            </div>

        </form>

    </div>

    <script>

        const form = document.getElementById("signupForm");
        const signupBtn = document.getElementById("signupBtn");


        /* =========================================================
           GET A USEFUL ERROR MESSAGE FROM ANY API RESPONSE
        ========================================================= */

        function getErrorMessage(data) {

            if (!data) {
                return "Unable to create account.";
            }

            /* Direct string response */
            if (typeof data === "string") {
                return data;
            }

            /* Normal API response:
               { message: "Something went wrong" }
            */
            if (typeof data.message === "string" && data.message.trim()) {
                return data.message;
            }

            /* Nested message:
               { message: { message: "Something went wrong" } }
            */
            if (
                data.message &&
                typeof data.message === "object" &&
                typeof data.message.message === "string"
            ) {
                return data.message.message;
            }

            /* Common error format:
               { error: "Something went wrong" }
            */
            if (typeof data.error === "string" && data.error.trim()) {
                return data.error;
            }

            /* Nested error:
               { error: { message: "Something went wrong" } }
            */
            if (
                data.error &&
                typeof data.error === "object" &&
                typeof data.error.message === "string"
            ) {
                return data.error.message;
            }

            /* Supabase-style nested error */
            if (
                data.error &&
                typeof data.error === "object" &&
                typeof data.error.error_description === "string"
            ) {
                return data.error.error_description;
            }

            /* Details field */
            if (typeof data.details === "string" && data.details.trim()) {
                return data.details;
            }

            /* Description field */
            if (
                typeof data.error_description === "string" &&
                data.error_description.trim()
            ) {
                return data.error_description;
            }

            /* Last resort:
               Convert the object into readable JSON instead of
               displaying [object Object].
            */
            try {
                return JSON.stringify(data);
            } catch (e) {
                return "Unable to create account.";
            }
        }


        /* =========================================================
           RESET BUTTON
        ========================================================= */

        function resetSignupButton() {
            signupBtn.disabled = false;
            signupBtn.textContent = "Create Account";
        }


        /* =========================================================
           SIGNUP
        ========================================================= */

        form.addEventListener("submit", async function (e) {

            e.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            /* ================= VALIDATION ================= */

            if (!email || !password || !confirmPassword) {

                alert("Please fill in all fields.");

                return;
            }


            if (password !== confirmPassword) {

                alert("Passwords do not match.");

                return;
            }


            /* ================= BUTTON STATE ================= */

            signupBtn.disabled = true;
            signupBtn.textContent = "Creating Account...";


            try {

                const response = await fetch("/api/signup", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email,
                        password: password
                    })

                });


                /* =================================================
                   READ RESPONSE SAFELY
                   ================================================= */

                const contentType =
                    response.headers.get("content-type") || "";

                let data;


                if (contentType.includes("application/json")) {

                    data = await response.json();

                } else {

                    const text = await response.text();

                    data = text || null;
                }


                console.log("Signup HTTP status:", response.status);
                console.log("Signup response:", data);


                /* =================================================
                   SUCCESS
                   ================================================= */

                if (response.ok) {

                    /*
                     * Your previous backend uses:
                     * { message: "200" }
                     *
                     * We also accept common successful responses
                     * so a small backend response-format change
                     * doesn't break the signup page.
                     */

                    const message =
                        typeof data === "object" && data !== null
                            ? data.message
                            : data;


                    if (
                        message === "200" ||
                        data?.success === true ||
                        data?.status === "success" ||
                        data?.status === 200
                    ) {

                        window.location.href = "/setup.html";

                        return;
                    }


                    /*
                     * If the HTTP request succeeded but the backend
                     * didn't return the old "200" message, still check
                     * for obvious success responses.
                     */

                    if (
                        typeof data === "string" &&
                        (
                            data.toLowerCase().includes("success") ||
                            data === "200"
                        )
                    ) {

                        window.location.href = "/setup.html";

                        return;
                    }
                }


                /* =================================================
                   ERROR
                   ================================================= */

                const errorMessage = getErrorMessage(data);

                alert(errorMessage);


                resetSignupButton();


            } catch (error) {

                console.error("Signup request failed:", error);

                resetSignupButton();


                /*
                 * Network/fetch error.
                 * This is different from an API error.
                 */

                alert(
                    error?.message ||
                    "Unable to connect to the server. Please try again."
                );

            }

        });

    </script>

</body>
</html>
