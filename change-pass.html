<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Studio | Change Password</title>

<link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/8g0LT3jZ/logo1-2.png"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#0b0b0b;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
}

.card{
    background:#141414;
    border:1px solid #252525;
    border-radius:14px;
    padding:35px;
}

h1{
    font-size:28px;
    font-weight:600;
    margin-bottom:8px;
}

.subtitle{
    color:#9d9d9d;
    font-size:14px;
    margin-bottom:30px;
    line-height:1.5;
}

.input-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#d5d5d5;
}

.password-box{
    position:relative;
}

input{
    width:100%;
    background:#1d1d1d;
    border:1px solid #303030;
    color:#fff;
    padding:14px 55px 14px 14px;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:border-color .25s, box-shadow .25s;
}

input:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.08);
}

input.input-error{
    border-color:#dc2626;
}

.toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#888;
    font-size:13px;
    user-select:none;
}

.toggle:hover{
    color:#fff;
}

.strength{
    width:100%;
    height:6px;
    background:#222;
    border-radius:50px;
    margin-top:12px;
    overflow:hidden;
}

.strength-bar{
    width:0%;
    height:100%;
    transition:.3s;
}

.strength-text{
    margin-top:8px;
    font-size:13px;
    color:#999;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:20px;
    text-align:center;
    padding:12px;
    border-radius:8px;
    font-size:14px;
    line-height:1.5;
}

.success{
    background:#13361d;
    color:#7ee787;
}

.error{
    background:#3a1616;
    color:#ff8a8a;
}

.back{
    text-align:center;
    margin-top:25px;
}

.back a{
    color:#8b8b8b;
    text-decoration:none;
    transition:.3s;
}

.back a:hover{
    color:#fff;
}

@media(max-width:500px){

    .card{
        padding:25px;
    }

    h1{
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Change Password</h1>

<p class="subtitle">
Choose a strong password that you haven't used before.
</p>

<form id="passwordForm">

<div class="input-group">

<label for="currentPassword">
Current Password
</label>

<div class="password-box">

<input
    type="password"
    id="currentPassword"
    autocomplete="current-password"
    required
>

<span
    class="toggle"
    onclick="togglePassword('currentPassword',this)"
>
Show
</span>

</div>

</div>

<div class="input-group">

<label for="newPassword">
New Password
</label>

<div class="password-box">

<input
    type="password"
    id="newPassword"
    autocomplete="new-password"
    required
>

<span
    class="toggle"
    onclick="togglePassword('newPassword',this)"
>
Show
</span>

</div>

<div class="strength">

<div
    class="strength-bar"
    id="strengthBar">
</div>

</div>

<div
    class="strength-text"
    id="strengthText">
Password Strength
</div>

</div>

<div class="input-group">

<label for="confirmPassword">
Confirm New Password
</label>

<div class="password-box">

<input
    type="password"
    id="confirmPassword"
    autocomplete="new-password"
    required
>

<span
    class="toggle"
    onclick="togglePassword('confirmPassword',this)"
>
Show
</span>

</div>

</div>

<button
    type="submit"
    id="updateButton"
>
Update Password
</button>

<div
    id="message"
    class="message">
</div>

</form>

<div class="back">

<a href="user.html">
← Back to Dashboard
</a>

</div>

</div>

</div>

<script>

const PASSWORD_KEY = "professionalStudio.demoPassword";

const passwordForm = document.getElementById("passwordForm");
const currentPassword = document.getElementById("currentPassword");
const newPassword = document.getElementById("newPassword");
const confirmPassword = document.getElementById("confirmPassword");

const strengthBar = document.getElementById("strengthBar");
const strengthText = document.getElementById("strengthText");
const message = document.getElementById("message");
const updateButton = document.getElementById("updateButton");

function getStoredPassword(){

    return localStorage.getItem(PASSWORD_KEY);

}

function togglePassword(id,element){

    const input = document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        element.textContent = "Hide";

    }else{

        input.type = "password";
        element.textContent = "Show";

    }

}

function calculateStrength(value){

    let score = 0;

    if(value.length >= 8){
        score++;
    }

    if(/[A-Z]/.test(value)){
        score++;
    }

    if(/[0-9]/.test(value)){
        score++;
    }

    if(/[!@#$%^&*(),.?":{}|<>_\-+=]/.test(value)){
        score++;
    }

    return score;

}

function updateStrength(){

    const value = newPassword.value;
    const score = calculateStrength(value);

    strengthBar.style.width = "0%";
    strengthBar.style.background = "transparent";

    if(!value){

        strengthText.textContent = "Password Strength";
        strengthText.style.color = "#999";
        return;

    }

    if(score <= 1){

        strengthBar.style.width = "25%";
        strengthBar.style.background = "#ef4444";
        strengthText.textContent = "Weak";
        strengthText.style.color = "#ef4444";

    }else if(score === 2){

        strengthBar.style.width = "50%";
        strengthBar.style.background = "#f59e0b";
        strengthText.textContent = "Fair";
        strengthText.style.color = "#f59e0b";

    }else if(score === 3){

        strengthBar.style.width = "75%";
        strengthBar.style.background = "#3b82f6";
        strengthText.textContent = "Good";
        strengthText.style.color = "#3b82f6";

    }else{

        strengthBar.style.width = "100%";
        strengthBar.style.background = "#22c55e";
        strengthText.textContent = "Strong";
        strengthText.style.color = "#22c55e";

    }

}

function showMessage(type,text){

    message.className = "message " + type;
    message.textContent = text;
    message.style.display = "block";

}

function clearMessage(){

    message.className = "message";
    message.textContent = "";
    message.style.display = "none";

}

newPassword.addEventListener("input",function(){

    updateStrength();
    newPassword.classList.remove("input-error");
    clearMessage();

});

confirmPassword.addEventListener("input",function(){

    confirmPassword.classList.remove("input-error");
    clearMessage();

});

currentPassword.addEventListener("input",function(){

    currentPassword.classList.remove("input-error");
    clearMessage();

});

passwordForm.addEventListener("submit",function(e){

    e.preventDefault();

    clearMessage();

    const current = currentPassword.value;
    const newPass = newPassword.value;
    const confirm = confirmPassword.value;

    if(!current){

        currentPassword.classList.add("input-error");
        showMessage("error","Please enter your current password.");
        currentPassword.focus();
        return;

    }

    if(newPass.length < 8){

        newPassword.classList.add("input-error");
        showMessage(
            "error",
            "New password must contain at least 8 characters."
        );
        newPassword.focus();
        return;

    }

    if(calculateStrength(newPass) < 3){

        newPassword.classList.add("input-error");
        showMessage(
            "error",
            "Please choose a stronger password using uppercase letters, numbers and special characters."
        );
        newPassword.focus();
        return;

    }

    if(newPass !== confirm){

        confirmPassword.classList.add("input-error");
        showMessage("error","Passwords do not match.");
        confirmPassword.focus();
        return;

    }

    if(current === newPass){

        newPassword.classList.add("input-error");
        showMessage(
            "error",
            "New password must be different from the current password."
        );
        return;

    }

    const storedPassword = getStoredPassword();

    if(storedPassword && current !== storedPassword){

        currentPassword.classList.add("input-error");
        showMessage("error","Current password is incorrect.");
        currentPassword.focus();
        return;

    }


    localStorage.setItem(PASSWORD_KEY,newPass);

    showMessage(
        "success",
        "Password updated successfully."
    );

    passwordForm.reset();

    strengthBar.style.width = "0%";
    strengthBar.style.background = "transparent";
    strengthText.textContent = "Password Strength";
    strengthText.style.color = "#999";

});

</script>

</body>
</html>
