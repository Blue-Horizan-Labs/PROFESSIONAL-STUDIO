<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Professional Studio | Change Password</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#0b0b0b;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
}

.card{
    background:#141414;
    border:1px solid #252525;
    border-radius:14px;
    padding:35px;
}

h1{
    font-size:28px;
    font-weight:600;
    margin-bottom:8px;
}

.subtitle{
    color:#9d9d9d;
    font-size:14px;
    margin-bottom:30px;
    line-height:1.5;
}

.input-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#d5d5d5;
}

.password-box{
    position:relative;
}

input{
    width:100%;
    background:#1d1d1d;
    border:1px solid #303030;
    color:#fff;
    padding:14px 45px 14px 14px;
    border-radius:10px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

input:focus{
    border-color:#3b82f6;
}

.toggle{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#888;
    font-size:13px;
    user-select:none;
}

.strength{
    width:100%;
    height:6px;
    background:#222;
    border-radius:50px;
    margin-top:12px;
    overflow:hidden;
}

.strength-bar{
    width:0%;
    height:100%;
    transition:.3s;
}

.strength-text{
    margin-top:8px;
    font-size:13px;
    color:#999;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
}

.message{
    display:none;
    margin-top:20px;
    text-align:center;
    padding:12px;
    border-radius:8px;
    font-size:14px;
}

.success{
    background:#13361d;
    color:#7ee787;
}

.error{
    background:#3a1616;
    color:#ff8a8a;
}

.back{
    text-align:center;
    margin-top:25px;
}

.back a{
    color:#8b8b8b;
    text-decoration:none;
    transition:.3s;
}

.back a:hover{
    color:#fff;
}

@media(max-width:500px){

.card{
    padding:25px;
}

h1{
    font-size:24px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Change Password</h1>

<p class="subtitle">
Choose a strong password that you haven't used before.
</p>

<form id="passwordForm">

<div class="input-group">

<label>Current Password</label>

<div class="password-box">

<input
type="password"
id="currentPassword"
required>

<span
class="toggle"
onclick="togglePassword('currentPassword',this)">
Show
</span>

</div>

</div>

<div class="input-group">

<label>New Password</label>

<div class="password-box">

<input
type="password"
id="newPassword"
required>

<span
class="toggle"
onclick="togglePassword('newPassword',this)">
Show
</span>

</div>

<div class="strength">

<div
class="strength-bar"
id="strengthBar">
</div>

</div>

<div
class="strength-text"
id="strengthText">
Password Strength
</div>

</div>

<div class="input-group">

<label>Confirm New Password</label>

<div class="password-box">

<input
type="password"
id="confirmPassword"
required>

<span
class="toggle"
onclick="togglePassword('confirmPassword',this)">
Show
</span>

</div>

</div>

<button type="submit">
Update Password
</button>

<div
id="message"
class="message">
</div>

</form>

<div class="back">
<a href="user.html">
← Back to Dashboard
</a>
</div>

</div>

</div>

<script>

function togglePassword(id,element){

const input=document.getElementById(id);

if(input.type==="password"){
input.type="text";
element.innerHTML="Hide";
}
else{
input.type="password";
element.innerHTML="Show";
}

}

const password=document.getElementById("newPassword");
const bar=document.getElementById("strengthBar");
const text=document.getElementById("strengthText");

password.addEventListener("input",()=>{

let value=password.value;
let score=0;

if(value.length>=8) score++;
if(/[A-Z]/.test(value)) score++;
if(/[0-9]/.test(value)) score++;
if(/[!@#$%^&*]/.test(value)) score++;

switch(score){

case 0:
case 1:
bar.style.width="25%";
bar.style.background="#ef4444";
text.innerHTML="Weak";
break;

case 2:
bar.style.width="50%";
bar.style.background="#f59e0b";
text.innerHTML="Fair";
break;

case 3:
bar.style.width="75%";
bar.style.background="#3b82f6";
text.innerHTML="Good";
break;

case 4:
bar.style.width="100%";
bar.style.background="#22c55e";
text.innerHTML="Strong";
break;

}

});

document.getElementById("passwordForm").addEventListener("submit",function(e){

e.preventDefault();

const current=document.getElementById("currentPassword").value;
const newPass=document.getElementById("newPassword").value;
const confirm=document.getElementById("confirmPassword").value;

const message=document.getElementById("message");

message.className="message";
message.style.display="block";

if(newPass!==confirm){

message.classList.add("error");
message.innerHTML="Passwords do not match.";

return;

}

if(newPass.length<8){

message.classList.add("error");
message.innerHTML="Password must contain at least 8 characters.";

return;

}

if(current===newPass){

message.classList.add("error");
message.innerHTML="New password must be different from the current password.";

return;

}

message.classList.add("success");
message.innerHTML="Password updated successfully.";

this.reset();

bar.style.width="0%";
text.innerHTML="Password Strength";

});

</script>

</body>
</html>
