<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Setup Your Portfolio</title>

<link rel="stylesheet" href="setup.css">

<link
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
rel="stylesheet">

</head>

<body>

<div class="background-blur blur1"></div>
<div class="background-blur blur2"></div>

<div class="setup-container">

<!-- ================= HEADER ================= -->

<header class="setup-header">

<h1>Complete Your Portfolio</h1>

<p>
Create your professional profile before accessing your dashboard.
</p>

<div class="progress-section">

<div class="progress-text">

<span>Step 1 of 3</span>

<span>33%</span>

</div>

<div class="progress-bar">

<div class="progress-fill"></div>

</div>

</div>

</header>

<!-- ================= FORM ================= -->

<form id="profileForm">

<!-- ================= STUDIO INFO ================= -->

<section class="card">

<h2>

<i class="fa-solid fa-building"></i>

Studio Information

</h2>

<div class="grid-2">

<div>
</div>

</div>

<div class="input-column">

<label>Studio Name</label>

<input id="studioName"
type="text"
placeholder="ex: Professional Studio">

<label>Studio Tagline</label>

<input id="studioTagline"
type="text"
placeholder="ex: Capturing Timeless Memories">

</div>

</div>

</section>

<!-- ================= PHOTOGRAPHER ================= -->

<section class="card">

<div class="section-heading">

<h2>

<i class="fa-solid fa-camera"></i>

Meet the Photographer

</h2>

</div>

<div id="photographerContainer">

<!-- Photographer Card -->

<div class="photographer-card">

<div class="photo-side">

<div class="upload-box">

<input 
type="file"
accept="image/*"
class="photoInput"
hidden>

<label class="upload-label">

<img
class="photoPreview"
src=""
alt="">

<i class="fa-solid fa-user"></i>

<p>Upload Photo</p>

<span>JPG or PNG</span>

</label>

</div>

</div>

<div class="details-side">

<div class="grid-2">

<div>

<label>Full Name</label>

<input 
id="photographerName"
type="text"
placeholder="ex: Rahul Patil">

</div>

<div>

<label>Professional Role</label>

<input
type="text"
placeholder="ex: Lead Photographer">

</div>

<div>

<label>Experience</label>

<input id="photographerExperience"
type="number"
placeholder="ex: 5">

</div>

<div>

<label>Specialization</label>

<input id="specialization"
type="text"
placeholder="ex: Wedding Photography">

</div>

</div>

<label>About Yourself</label>

<textarea
id="about"
rows="5"
placeholder="Tell clients about yourself, your experience and photography style."></textarea>

<div class="grid-2">

<div>

<label>Email</label>

<input 
id="email"
type="email"
placeholder=" example@email.com">

</div>

<div>

<label>Phone Number</label>

<input
id="phone"
type="tel"
placeholder="ex: +91 9876543210">

</div>

</div>

</div>

</div>

</div>

</section>

<!-- ================= CONTACT ================= -->

<section class="card">

<h2>

<i class="fa-solid fa-phone"></i>

Studio Contact (OPTIONAL)

</h2>

<div class="grid-2">

<div>

<label>Studio Phone</label>

<input
type="tel"
placeholder="ex: +91 9876543210">

</div>

<div>

<label>Studio Email</label>

<input
type="email"
placeholder="ex: studio@email.com">

</div>

<div>

<label>Website</label>

<input
type="url"
placeholder="ex: https://yourwebsite.com">

</div>

<div>

<label>Business Hours</label>

<input
type="text"
placeholder="ex: 9:00 AM - 7:00 PM">

</div>

</div>

</section>

<!-- ================= ADDRESS ================= -->

<section class="card">

<h2>

<i class="fa-solid fa-location-dot"></i>

Studio Address

</h2>

<label>Street Address</label>

<input 
id="address"
type="text"
placeholder="Street Address">

<div class="grid-2">

<div>

<label>City</label>

<input
type="text"
placeholder="City">

</div>

<div>

<label>State</label>

<input
type="text"
placeholder="State">

</div>

<div>

<label>Country</label>

<input
type="text"
placeholder="Country">

</div>

<div>

<label>Pincode</label>

<input
type="text"
placeholder="ex: 411001">

</div>

</div>

</section>

<!-- ================= SOCIAL ================= -->

<section class="card">

<h2>

<i class="fa-solid fa-share-nodes"></i>

Social Media

</h2>

<div class="grid-2">

<div>

<label>Instagram</label>

<input id="instagram"
type="url"
placeholder="ex: https://instagram.com/yourprofile">

</div>

<div>

<label>Facebook</label>

<input id="facebook"
type="url"
placeholder="ex: https://facebook.com/yourprofile">

</div>

<div>

<label>YouTube</label>

<input id="youtube"
type="url"
placeholder="ex: https://youtube.com/yourchannel">

</div>

<div>

<label>LinkedIn (Optional)</label>

<input
type="url"
placeholder="ex: https://linkedin.com/in/yourprofile">

</div>

</div>

</section>

<!-- ================= BUTTONS ================= -->

<div class="buttons">

<button
type="submit"
class="save-btn">

Save & Continue

<i class="fa-solid fa-arrow-right"></i>

</button>

</div>

</form>

</div>

<script src="setup.js"></script>

</body>

</html>
