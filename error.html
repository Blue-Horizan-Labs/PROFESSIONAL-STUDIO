<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error | Professional Studio</title>
    <link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/8g0LT3jZ/logo1-2.png" 
>


    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f5f5;
            color:#333;
        }

        .error-box{
            text-align:center;
            padding:40px;
            max-width:450px;
        }

        h1{
            font-size:80px;
            color:#444;
            margin-bottom:10px;
        }

        h2{
            margin-bottom:15px;
        }

        p{
            color:#666;
            margin-bottom:30px;
            line-height:1.6;
        }

        .buttons{
            display:flex;
            justify-content:center;
            gap:15px;
            flex-wrap:wrap;
        }

        button:focus-visible{
            outline:3px solid #80bfff;
            outline-offset:3px;
        }

        @media(max-width:480px){
            .error-box{padding:24px;}
            h1{font-size:64px;}
            .buttons button{width:100%;}
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:15px;
            transition:.2s;
        }

        .back{
            background:#333;
            color:white;
        }

        .retry{
            background:#007bff;
            color:white;
        }

        button:hover{
            opacity:.9;
        }
    </style>
</head>
<body>

    <div class="error-box">
        <h1>404</h1>
        <h2>Page Not Found</h2>

        <p>
            Sorry, the page you are looking for could not be found.
            Please go back to the home page or try again.
        </p>

        <div class="buttons">
            <button class="back" type="button" onclick="goBack()">
                Go Back
            </button>

            <button class="retry" type="button" onclick="window.location.reload()">
                Retry
            </button>
        </div>
    </div>

<script>
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
            return;
        }
        window.location.href = "/index.html";
    }
</script>

</body>
</html>
